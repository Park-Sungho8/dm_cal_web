<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>The More</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#08080b" />

  <!-- iOS "홈 화면에 추가" 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="더모아" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===================== 홈 메뉴 ===================== -->
  <section id="view-home" class="view" data-view="home">
    <div class="home-inner">
      <div class="home-head">
        <h1 class="home-title">The More</h1>
        <p class="home-sub">환율 · 합산 계산기</p>
      </div>
      <nav class="home-menu">
        <a class="menu-btn" href="#/exchange">
          <span class="menu-btn__icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/>
              <path d="m17 20 4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/>
            </svg>
          </span>
          <span class="menu-btn__label">환율 계산</span>
          <span class="menu-btn__chev" aria-hidden="true">›</span>
        </a>
        <a class="menu-btn" href="#/sum">
          <span class="menu-btn__icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
            </svg>
          </span>
          <span class="menu-btn__label">합산 계산</span>
          <span class="menu-btn__chev" aria-hidden="true">›</span>
        </a>
      </nav>
    </div>
  </section>

  <!-- ===================== 환율 계산 ===================== -->
  <section id="view-exchange" class="view" data-view="exchange" hidden>
    <header class="nav-bar">
      <a class="nav-back" href="#/">‹ The More</a>
      <span class="nav-title">환율 계산</span>
      <span class="nav-spacer"></span>
    </header>

    <div class="scroll">
      <!-- 저장된 환율 표시 -->
      <div id="ex-saved" class="saved-rate" hidden>
        <div id="ex-saved-value" class="saved-rate__value">—</div>
        <div id="ex-saved-meta" class="saved-rate__meta">—</div>
      </div>

      <!-- 계산 결과 -->
      <div class="ex-result">
        <span id="ex-result-num" class="ex-result__num placeholder">입력하슈</span>
        <span id="ex-result-unit" class="ex-result__unit" hidden>₩/¥</span>
      </div>

      <button id="ex-save" class="btn-primary" type="button" disabled>저장</button>

      <!-- 수동 입력 -->
      <div class="fields">
        <input id="ex-payment" class="field" inputmode="decimal" placeholder="결제 금액 [¥]" />
        <input id="ex-amountA" class="field" inputmode="decimal" placeholder="결제 전 누적금액 [₩]" />
        <input id="ex-amountB" class="field" inputmode="decimal" placeholder="결제 후 누적금액 [₩]" />
      </div>

      <!-- 실시간 환율 -->
      <div class="live-box">
        <div class="live-box__head">실시간 환율 (엔 → 원)</div>
        <div id="ex-live-value" class="live-box__value">—</div>
        <div class="live-box__actions">
          <button id="ex-live-fetch" class="btn-ghost" type="button">불러오기</button>
          <button id="ex-live-save" class="btn-primary btn-sm" type="button" disabled>이 환율로 저장</button>
        </div>
        <div id="ex-live-msg" class="live-box__msg"></div>
      </div>
    </div>
  </section>

  <!-- ===================== 합산 계산 ===================== -->
  <section id="view-sum" class="view" data-view="sum" hidden>
    <header class="nav-bar">
      <a class="nav-back" href="#/">‹ The More</a>
      <span class="nav-title">합산 계산</span>
      <span class="nav-spacer"></span>
    </header>

    <div class="sum-body">
      <div id="sum-total" class="sum-total">0.00원</div>

      <div class="sum-middle">
        <div id="sum-chips" class="chips"></div>
        <div id="sum-thresholds" class="thresholds" hidden></div>
      </div>

      <div class="sum-footer">
        <div id="sum-input" class="sum-input"></div>
        <div id="sum-keypad" class="keypad"></div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
